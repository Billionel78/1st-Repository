<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f8a">
  <title>ICE MANAGER</title>
  <meta name="description" content="Gestion de bar : commandes, tables, paiements, stock et fournisseurs.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ICE MANAGER">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app" hidden>
    <header class="topbar">
      <a href="#/" class="brand"><span class="brand-icon" aria-hidden="true">🧊</span><span id="bar-name">ICE MANAGER</span></a>
      <div class="topbar-right">
        <span id="clock" class="clock"></span>
        <button id="user-btn" class="user-btn" type="button" aria-haspopup="menu">
          <span id="user-name"></span> <span aria-hidden="true">▾</span>
        </button>
        <div id="user-menu" class="user-menu" role="menu" hidden>
          <div class="user-menu-role" id="user-role"></div>
          <button type="button" role="menuitem" data-action="backdate" id="menu-backdate" hidden>Saisir des ventes passées (rattrapage)</button>
          <button type="button" role="menuitem" data-action="install" id="menu-install" hidden>📲 Installer l’application</button>
          <button type="button" role="menuitem" data-action="password">Changer mon mot de passe</button>
          <button type="button" role="menuitem" data-action="logout">Se déconnecter</button>
        </div>
      </div>
    </header>
    <div id="backdate-banner" class="backdate-banner" role="status" hidden></div>
    <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="login-logo" aria-hidden="true">🧊</div>
      <h1>ICE MANAGER</h1>
      <p class="muted">Gestion de bar</p>
      <label>Nom d'utilisateur
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>Mot de passe
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="form-error" role="alert"></p>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Se connecter</button>
      <button class="link-btn" type="button" id="forgot-link">Mot de passe oublié ?</button>
      <button class="btn btn-block install-btn" type="button" id="login-install" hidden>📲 Installer l’application sur cet appareil</button>
    </form>
  </section>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
